name: Update mortgage rates
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch FRED PMMS
        run: |
          curl -sSL "https://fred.stlouisfed.org/graph/fredgraph.csv?id=MORTGAGE30US,MORTGAGE15US" -o r.csv
          python3 - <<'PY'
          import csv,json
          rows=[r for r in csv.reader(open('r.csv'))][1:]
          rows=[r for r in rows if len(r)>=3 and r[1] not in ('','.') and r[2] not in ('','.')]
          d,a,b=rows[-1][:3]
          json.dump({"date":d,"rate30":float(a),"rate15":float(b),"source":"Freddie Mac PMMS via FRED"},open('rates.json','w'))
          PY
          cat rates.json
      - name: Commit
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || git commit -m "Update rates"
          git push
